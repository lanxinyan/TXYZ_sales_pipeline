[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-pipeline"
version = "0.1.0"
description = "Turn sales-order emails in Gmail into Sales Orders in Zoho CRM"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.13",
  "pydantic>=2.6",
  "requests>=2.31",
  "google-api-python-client>=2.100",
  "google-auth-oauthlib>=1.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sales-pipeline = "sales_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sales_pipeline = ["ui.html", "templates.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
